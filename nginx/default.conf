server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Stage 8 (monitoring): access + error logs go to stdout/stderr, so
    # `docker logs sprintboard` shows every request.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Health endpoint used by Docker HEALTHCHECK, CD smoke test and uptime monitors.
    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # build info (written at image build time) so you can see which commit is live
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files /version.json =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
