name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (syntax check)
        run: npm run lint

      - name: Run tests
        run: npm test

  docker:
    name: Build & push Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      APP_URL: https://CHANGE-ME-TO-YOUR-NEW-SERVICE.onrender.com
    steps:
      - name: Check deploy hook secret
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Add RENDER_DEPLOY_HOOK in repository Actions secrets."
            exit 1
          fi

      - name: Deploy the image built by this workflow
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          echo "Triggering Render deployment for $IMAGE"
          curl --fail-with-body --show-error --silent --get \
            --data-urlencode "imgURL=$IMAGE" \
            "$RENDER_DEPLOY_HOOK"
          echo

      - name: Smoke test the deployed app
        run: |
          sleep 30
          for attempt in $(seq 1 40); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$APP_URL/" || true)"
            echo "Attempt $attempt/40 - HTTP status for /: $CODE"
            if [ "$CODE" = "200" ]; then
              echo "App is up."
              exit 0
            fi
            sleep 10
          done
          echo "::error::App did not return HTTP 200 in time."
          exit 1
