name: CI/CD

# Stage 3: the pipeline starts automatically when code is pushed to GitHub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Stage 3 (CI) + Stage 4 (Automated testing)
  # ---------------------------------------------------------------
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (syntax check)
        run: npm run lint

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------
  # Stage 5 (Containerization): build, tag and push the Docker image
  # Runs only if the tests above passed.
  # ---------------------------------------------------------------
  docker:
    name: Build & push Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build the image (no push); main pushes to GHCR.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # Stage 6 (Continuous Deployment) + Stage 7 (check the running app)
  # Deploys to your server over SSH. If the secrets below are not set,
  # this job skips deployment instead of failing.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to server
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - name: Deploy container
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY not set - skipping deployment."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
            set -e
            # a read-only token is only needed if the package is private
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            docker pull "$IMAGE"
            docker rm -f sprintboard 2>/dev/null || true
            docker run -d --name sprintboard --restart unless-stopped -p 80:80 "$IMAGE"
          REMOTE

      # Stage 7: confirm the new version is up and answering
      - name: Smoke test the running app
        if: env.SKIP_DEPLOY != 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 5 "http://$DEPLOY_HOST/health"; then
              echo "App is healthy."
              curl -fsS "http://$DEPLOY_HOST/version.json"
              exit 0
            fi
            echo "Not ready yet (attempt $i), waiting..."
            sleep 5
          done
          echo "::error::Health check failed after deployment"
          exit 1
